<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Sent — SMB Solved</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0B1D3A;
  --teal: #2EC4B6;
  --gold: #E8B931;
  --cream: #FAFAF7;
  --white: #FFFFFF;
  --text-mid: #475569;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'DM Sans', sans-serif;
  background: linear-gradient(165deg, var(--navy) 0%, #0F2847 55%, #14365E 100%);
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 2rem;
  text-align: center;
}
.success-card {
  background: var(--white);
  border-radius: 16px;
  padding: 3.5rem 3rem;
  max-width: 520px;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}
.success-icon {
  width: 64px; height: 64px;
  background: linear-gradient(135deg, rgba(46,196,182,.12), rgba(46,196,182,.05));
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 1.5rem;
  font-size: 1.8rem;
}
h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.8rem; font-weight: 600;
  color: var(--navy);
  margin-bottom: .75rem;
}
p {
  font-size: .95rem; line-height: 1.7;
  color: var(--text-mid);
  margin-bottom: 2rem;
}
.back-link {
  display: inline-flex; align-items: center; gap: .5rem;
  padding: .85rem 2rem;
  background: var(--teal); color: var(--navy);
  font-weight: 700; font-size: .9rem;
  border-radius: 8px; text-decoration: none;
  transition: all .25s;
}
.back-link:hover { background: var(--gold); transform: translateY(-1px); }
</style>
</head>
<body>
<div class="success-card">
  <div class="success-icon">✓</div>
  <h1>Message received.</h1>
  <p>Thanks for reaching out. I'll review your message and get back to you within 24 hours. If you need something urgent, feel free to email me directly at <a href="mailto:jimmy@smbsolved.com" style="color:#2EC4B6;">jimmy@smbsolved.com</a>.</p>
  <a href="/" class="back-link">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8H3M7 4L3 8l4 4"/></svg>
    Back to SMB Solved
  </a>
</div>
</body>
</html>
